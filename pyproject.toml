[project]
name = "GOTTA-BIKE-Virtual-Team-Dicord-bot"
version = "0.1.0"
description = "Manage your zwift team on discord. and orginize your racing"
requires-python = ">=3.14"
dependencies = [
    "audioop-lts>=0.2.2",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "logfire[httpx]>=4.41.0",
    "py-cord>=2.8.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "logfire-mcp>=0.9.0",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]
